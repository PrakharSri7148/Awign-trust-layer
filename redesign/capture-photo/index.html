<!doctype html>
<html lang="en" class="cv-html" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capture · Photo step · prototype</title>
  <link rel="stylesheet" href="css/cap-tokens.css" />
  <link rel="stylesheet" href="css/cap-components.css" />
  <link rel="stylesheet" href="css/cap-viewer.css" />
</head>
<body class="cv-body">
<div class="cv-layout">
  <aside class="cv-side" aria-label="Prototype state switcher">
    <div><h1>Capture · Photo step</h1><p>Prototype state switcher. Pick a state, a device width and a theme. Inside the page everything is clickable: the buttons move between states.</p></div>
    <div class="cv-links"><a href="app.html" target="_blank" rel="noopener">Open full page</a><a href="frames.html">Gallery</a><a href="coverage.html">Coverage</a><a href="tokens.html">Tokens + components</a></div>
    <div class="cv-group"><h2>Device</h2><div class="cv-seg" id="cv-dev" role="group" aria-label="Device width">
      <button type="button" data-dev="desktop" aria-pressed="true">Desktop</button><button type="button" data-dev="tablet" aria-pressed="false">Tablet</button><button type="button" data-dev="phone" aria-pressed="false">Phone</button></div></div>
    <div class="cv-group"><h2>Theme</h2><div class="cv-seg" id="cv-theme" role="group" aria-label="Theme"><button type="button" data-th="dark" aria-pressed="true">Dark</button><button type="button" data-th="light" aria-pressed="false">Light (outdoor)</button></div></div>
    <div class="cv-group"><h2>Next photo result (when you tap the shutter)</h2><div class="cv-seg" id="cv-next" role="group" aria-label="Next result"><button type="button" data-n="pass" aria-pressed="true">Pass</button><button type="button" data-n="warn" aria-pressed="false">Warn</button><button type="button" data-n="block" aria-pressed="false">Blocked</button></div></div>
    <div class="cv-group"><h2>Try it by hand</h2><button type="button" class="cap-btn" id="cv-manual">Reset: start from the idle camera (flows on)</button></div>
    <div id="cv-states" style="display:grid;gap:14px"></div>
  </aside>
  <main class="cv-main">
    <div class="cv-bar"><span id="cv-info" class="cv-title"></span></div>
    <div class="cv-stagewrap" id="cv-wrap"><div class="cv-frame" id="cv-frame"><iframe id="cv-if" title="Capture page prototype" src="app.html?state=idle"></iframe></div></div>
  </main>
</div>
<script src="js/cap-icons.js"></script><script src="js/cap-data.js"></script><script src="js/cap-state.js"></script>
<script>
(function () {
  var DEV = { desktop: [1280, 860], tablet: [820, 1100], phone: [390, 844] };
  var dev = 'desktop', theme = 'dark', cur = 'idle', next = 'pass';
  var q = new URLSearchParams(location.search);
  if (q.get('dev') && DEV[q.get('dev')]) dev = q.get('dev');
  if (q.get('theme') === 'light') theme = 'light';
  if (q.get('state')) cur = q.get('state');
  var iframe = document.getElementById('cv-if'), frame = document.getElementById('cv-frame'), wrap = document.getElementById('cv-wrap');
  var P = window.CAP_STATE.presets, groups = {};
  P.forEach(function (p) { (groups[p.group] = groups[p.group] || []).push(p); });
  var box = document.getElementById('cv-states');
  Object.keys(groups).forEach(function (g) {
    var d = document.createElement('div'); d.className = 'cv-group'; d.innerHTML = '<h2>' + g + '</h2>';
    groups[g].forEach(function (p) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'cv-state'; b.dataset.id = p.id;
      b.innerHTML = p.label + (p.desc ? '<small>' + p.desc + '</small>' : ''); b.onclick = function () { setState(p.id); }; d.appendChild(b);
    }); box.appendChild(d);
  });
  function post(m) { try { iframe.contentWindow.postMessage(m, '*'); } catch (e) {} }
  function setState(id) { cur = id; post({ cap: 'apply', id: id }); post({ cap: 'theme', value: theme }); post({ cap: 'next', value: next }); mark(); history.replaceState(null, '', '?state=' + id + '&dev=' + dev + '&theme=' + theme); }
  function mark(id) { var a = id === undefined ? cur : id; document.querySelectorAll('.cv-state').forEach(function (b) { b.setAttribute('aria-current', b.dataset.id === a ? 'true' : 'false'); }); document.getElementById('cv-info').textContent = (a ? (window.CAP_STATE.byId[a] || {}).label : 'manual use') + ' · ' + DEV[dev][0] + '×' + DEV[dev][1] + ' · ' + theme; }
  function fit() {
    var w = DEV[dev][0], h = DEV[dev][1], pad = dev === 'phone' ? 16 : 0;
    var aw = wrap.clientWidth - 32, ah = wrap.clientHeight - 32;
    var k = Math.min(1, aw / (w + pad), ah / (h + pad));
    iframe.style.width = w + 'px'; iframe.style.height = h + 'px';
    frame.style.width = (w + pad) * k + 'px'; frame.style.height = (h + pad) * k + 'px';
    frame.className = 'cv-frame' + (dev === 'phone' ? ' cv-frame--phone' : '');
    iframe.style.transformOrigin = 'top left'; iframe.style.transform = 'scale(' + k + ')';
    frame.style.overflow = 'hidden'; iframe.style.width = w + 'px'; iframe.style.height = h + 'px';
  }
  function press(sel, attr, val) { document.querySelectorAll(sel + ' button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset[attr] === val)); }); }
  document.getElementById('cv-dev').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; dev = b.dataset.dev; press('#cv-dev', 'dev', dev); fit(); mark(); };
  document.getElementById('cv-theme').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; theme = b.dataset.th; press('#cv-theme', 'th', theme); document.documentElement.setAttribute('data-theme', theme); post({ cap: 'theme', value: theme }); mark(); };
  document.getElementById('cv-next').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; next = b.dataset.n; press('#cv-next', 'n', next); post({ cap: 'next', value: next }); };
  document.getElementById('cv-manual').onclick = function () { cur = null; iframe.src = 'app.html?theme=' + theme + '&next=' + next; mark(null); };
  window.addEventListener('message', function (e) { if (e.data && e.data.cap === 'state') { cur = e.data.id; mark(e.data.id); } });
  window.addEventListener('resize', fit);
  press('#cv-dev', 'dev', dev); press('#cv-theme', 'th', theme); document.documentElement.setAttribute('data-theme', theme);
  iframe.addEventListener('load', function () { post({ cap: 'theme', value: theme }); post({ cap: 'next', value: next }); });
  iframe.src = 'app.html?state=' + cur + '&theme=' + theme; fit(); mark();
})();
</script>
</body>
</html>
